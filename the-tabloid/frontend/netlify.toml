[build]
  base = "the-tabloid/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Vite SPA — every route serves index.html so React handles its own routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed asset bundles; never cache the entrypoint HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
